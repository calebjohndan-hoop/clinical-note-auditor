# One-click deploy on Render (free plan): Dashboard -> New -> Blueprint -> pick this repo.
# Render asks for LLM_API_KEY (your Groq key). Leave it blank to run regex-only.
services:
  - type: web
    name: clinical-note-auditor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      # Public demo: never make a visitor wait on the free tier's rate limit.
      # A slow or rate-limited LLM falls back to regex with a visible warning.
      - key: LLM_MAX_WAIT
        value: "5"
      - key: LLM_TIMEOUT
        value: "30"
