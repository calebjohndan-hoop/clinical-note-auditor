<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinical Note Auditor</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5d6670; --line:#dde1e6;
          --high:#b42318; --high-bg:#fdecea; --med:#9a6700; --med-bg:#fff6dd; --ok:#1a7f37; --ok-bg:#e8f6ec; --accent:#2457c5; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 10px; }
  textarea { width:100%; min-height:260px; font:14px/1.5 ui-monospace,Menlo,Consolas,monospace; border:1px solid var(--line); border-radius:8px; padding:10px; resize:vertical; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; padding:8px 18px; }
  .banner { border-radius:8px; padding:10px 12px; font-weight:600; margin-bottom:12px; }
  .banner.high { background:var(--high-bg); color:var(--high); }
  .banner.ok { background:var(--ok-bg); color:var(--ok); }
  .banner.warn { background:var(--med-bg); color:var(--med); font-weight:500; }
  .flag { border-left:4px solid var(--line); padding:6px 10px; margin:6px 0; background:#fafbfc; border-radius:0 6px 6px 0; }
  .flag.high { border-color:var(--high); } .flag.medium { border-color:var(--med); }
  .sev { font-size:11px; font-weight:700; text-transform:uppercase; margin-right:6px; }
  .sev.high { color:var(--high); } .sev.medium { color:var(--med); }
  .ev { color:var(--muted); font-size:12px; font-family:ui-monospace,Menlo,monospace; }
  ol.check { padding-left:20px; margin:0; } ol.check li { margin:6px 0; }
  .why { color:var(--muted); font-size:13px; }
  dl.soap { margin:0; } dl.soap dt { font-weight:700; margin-top:8px; } dl.soap dd { margin:2px 0 0; color:#333; white-space:pre-wrap; }
  .empty { color:var(--muted); font-style:italic; }
  .meta { color:var(--muted); font-size:12px; margin-top:10px; }
  .full { grid-column:1 / -1; }
</style>
</head>
<body>
<main>
  <h1>Clinical Note Auditor</h1>
  <p class="sub">Paste a clinical note. Deterministic rules check for drug–allergy conflicts, out-of-range doses and missing documentation. Synthetic/de-identified notes only.</p>

  <div class="grid">
    <section class="card">
      <h2>Note</h2>
      <textarea id="note" spellcheck="false"></textarea>
      <div class="row">
        <button class="primary" id="run">Audit note</button>
        <span style="color:var(--muted);font-size:13px">Samples:</span>
        <button data-s="conflict">Allergy conflict</button>
        <button data-s="dose">Dose error</button>
        <button data-s="messy">Messy prose</button>
        <button data-s="hidden">Hidden allergy</button>
        <button data-s="clean">Clean</button>
      </div>
    </section>

    <section class="card">
      <h2>Result</h2>
      <div id="result"><p class="empty">Run an audit to see flags and the action checklist.</p></div>
    </section>

    <section class="card full">
      <h2>Structured SOAP note</h2>
      <div id="soap"><p class="empty">—</p></div>
    </section>
  </div>
</main>
<script>
const SAMPLES = {
  conflict: "Patient presents with sinus infection. Allergies: penicillin.\nBP: 118/76. HR: 72. Temp: 98.6. RR: 16.\nPlan: Start amoxicillin 500mg three times daily for 10 days.",
  dose: "Patient here for diabetes follow-up. Allergies: NKDA.\nBP 130/85 HR 76 Temp 98.7 RR 15.\nPlan: Give 5000 mg metformin daily.",
  messy: "Pt has an allergy to PCN (hives) noted in chart.\nRx: Augmentin 875 mg PO BID x 10d.\nPulse 88, BP 124/80.",
  hidden: "Pt seen for UTI. Hx: anaphylaxis after a pen-class antibiotic as a child.\nBP 126/82, HR 78, Temp 99.1, RR 16.\nPlan: ampicillin 500 mg PO q6h x 7 days.",
  clean: "Patient here for routine follow-up. Allergies: no known drug allergies.\nBP: 122/78. HR: 70. Temp: 98.6. RR: 16.\nAssessment: hyperlipidemia, stable.\nPlan: Continue atorvastatin 20mg daily."
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { $("note").value = SAMPLES[b.dataset.s]; run(); });
$("run").onclick = run;
$("note").value = SAMPLES.messy;

async function run() {
  const text = $("note").value.trim();
  if (!text) return;
  $("result").innerHTML = '<p class="empty">Auditing…</p>';
  let data;
  try {
    const r = await fetch("/audit", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
    data = await r.json();
    if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
  } catch (e) {
    $("result").innerHTML = `<div class="banner high">Note was NOT audited: ${esc(e.message)}</div>`;
    return;
  }
  const high = data.has_high_severity;
  let h = high
    ? `<div class="banner high">⚠ High-severity issue — review before signing or dispensing</div>`
    : data.flags.length ? `<div class="banner warn">Documentation gaps found</div>`
    : `<div class="banner ok">No issues found by the current rules</div>`;
  if (data.extractor_warning) h += `<div class="banner warn">${esc(data.extractor_warning)}</div>`;
  if (data.checklist.length) {
    h += `<h2>Action checklist</h2><ol class="check">` + data.checklist.map(a =>
      `<li><strong>${esc(a.action)}</strong><div class="why">Why: ${esc(a.because)}</div></li>`).join("") + `</ol>`;
  }
  if (data.flags.length) {
    h += `<h2 style="margin-top:14px">Flags</h2>` + data.flags.map(f =>
      `<div class="flag ${esc(f.severity)}"><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>${esc(f.message)}<div class="ev">${esc(f.evidence)}</div></div>`).join("");
  }
  const sn = data.structured_note;
  h += `<div class="meta">Extractor: ${esc(data.extractor)} · allergies: ${esc(sn.allergies ? (sn.allergies.join(", ") || "none documented") : "NOT DOCUMENTED")} · meds: ${esc((sn.medications||[]).map(m => m.name + " " + m.dose + "mg").join(", ") || "none")}</div>`;
  $("result").innerHTML = h;
  const s = data.soap || {};
  $("soap").innerHTML = `<dl class="soap">` + ["subjective","objective","assessment","plan"].map(k =>
    `<dt>${k[0].toUpperCase()+k.slice(1)}</dt><dd>${s[k] ? esc(s[k]) : '<span class="empty">not documented</span>'}</dd>`).join("") + `</dl>`;
}
</script>
</body>
</html>
